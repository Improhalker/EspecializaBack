name: Deploy Laravel API

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: especializa-api-production
  cancel-in-progress: false

env:
  PHP_VERSION: "8.4"
  DEPLOY_PATH: /var/www/especializa-back

jobs:
  verify:
    name: Validate application
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: bcmath, curl, fileinfo, gd, intl, mbstring, openssl, pdo_sqlite, sqlite3, xml, zip
          coverage: none
          tools: composer:v2

      - name: Install test dependencies
        run: composer install --prefer-dist --no-progress --no-interaction

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: Check code style
        run: vendor/bin/pint --test

      - name: Run automated tests
        run: php artisan test --compact

  deploy:
    name: Deploy to production
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      HEALTHCHECK_URL: https://api.especializacondutor.com.br/api/home
      RELEASE_PATH: /tmp/especializa-api-${{ github.sha }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: bcmath, curl, fileinfo, gd, intl, mbstring, openssl, pdo_pgsql, xml, zip
          coverage: none
          tools: composer:v2

      - name: Install production dependencies
        run: composer install --no-dev --prefer-dist --optimize-autoloader --no-progress --no-interaction

      - name: Validate deployment configuration
        shell: bash
        run: |
          set -euo pipefail

          for name in SSH_HOST SSH_USER SSH_PRIVATE_KEY SSH_KNOWN_HOSTS; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required GitHub configuration: ${name}" >&2
              exit 1
            fi
          done

          echo "SSH_PORT=${SSH_PORT:-22}" >> "$GITHUB_ENV"

      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail

          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/especializa_deploy"
          chmod 600 "$HOME/.ssh/especializa_deploy"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh-keygen -y -f "$HOME/.ssh/especializa_deploy" > /dev/null

      - name: Upload release candidate
        shell: bash
        run: |
          set -euo pipefail

          SSH_COMMAND="ssh -i $HOME/.ssh/especializa_deploy -p $SSH_PORT -o BatchMode=yes -o StrictHostKeyChecking=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=3"

          $SSH_COMMAND "$SSH_USER@$SSH_HOST" "rm -rf '$RELEASE_PATH' && mkdir -p '$RELEASE_PATH'"

          for attempt in 1 2 3; do
            if rsync -rltz --delete --partial \
              --exclude='.env' \
              --exclude='.git/' \
              --exclude='.github/' \
              --exclude='bootstrap/cache/' \
              --exclude='node_modules/' \
              --exclude='public/storage' \
              --exclude='storage/' \
              --exclude='tests/' \
              -e "$SSH_COMMAND" \
              ./ "$SSH_USER@$SSH_HOST:$RELEASE_PATH/"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Release upload failed after 3 attempts" >&2
              exit 1
            fi
            sleep 5
          done

      - name: Activate release
        shell: bash
        run: |
          set -euo pipefail

          ssh \
            -i "$HOME/.ssh/especializa_deploy" \
            -p "$SSH_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "$SSH_USER@$SSH_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' RELEASE_PATH='$RELEASE_PATH' bash -s" <<'REMOTE_SCRIPT'
          set -Eeuo pipefail
          umask 0002

          test -f "$DEPLOY_PATH/.env"
          test -f "$RELEASE_PATH/artisan"
          id -nG | tr ' ' '\n' | grep -qx www-data

          php -r 'exit(version_compare(PHP_VERSION, "8.4.0", ">=") && version_compare(PHP_VERSION, "8.5.0", "<") ? 0 : 1);'
          php -r 'foreach (["fileinfo", "gd", "mbstring", "openssl", "pdo_pgsql"] as $extension) { if (! extension_loaded($extension)) { fwrite(STDERR, "Missing PHP extension: {$extension}\n"); exit(1); } }'
          cd "$DEPLOY_PATH"
          php -r 'require "vendor/autoload.php"; $app = require "bootstrap/app.php"; $app->make(\Illuminate\Contracts\Console\Kernel::class)->bootstrap(); if (rtrim((string) config("app.url"), "/") !== "https://api.especializacondutor.com.br") { fwrite(STDERR, "APP_URL must use the public HTTPS API origin for cached media URLs.\n"); exit(1); }'

          maintenance_enabled=0
          cleanup() {
            status=$?
            if [ "$maintenance_enabled" -eq 1 ]; then
              cd "$DEPLOY_PATH"
              php artisan up --no-interaction || true
            fi
            rm -rf "$RELEASE_PATH"
            exit "$status"
          }
          trap cleanup EXIT

          cd "$DEPLOY_PATH"
          php artisan down --retry=60 --refresh=15 --no-interaction || true
          maintenance_enabled=1

          rsync -rlt --delete \
            --exclude='.env' \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='bootstrap/cache/' \
            --exclude='public/storage' \
            --exclude='storage/' \
            "$RELEASE_PATH/" "$DEPLOY_PATH/"

          cd "$DEPLOY_PATH"
          mkdir -p storage/framework/{cache,sessions,views} storage/logs bootstrap/cache

          php artisan optimize:clear --no-interaction
          php artisan migrate --force --no-interaction
          php artisan storage:link --no-interaction || true
          php artisan config:cache --no-interaction
          php artisan route:cache --no-interaction
          php artisan view:cache --no-interaction
          find storage bootstrap/cache \( -type d -o -type f \) -user "$(id -un)" -exec chgrp www-data {} +
          find storage bootstrap/cache \( -type d -o -type f \) -user "$(id -un)" -exec chmod g+rwX {} +
          find storage bootstrap/cache -type d -user "$(id -un)" -exec chmod g+s {} +
          php artisan media:warm-cache --no-interaction
          php artisan queue:restart --no-interaction || true
          php artisan up --no-interaction
          maintenance_enabled=0
          php artisan courses:warm-cache --no-interaction

          rm -rf "$RELEASE_PATH"
          trap - EXIT
          REMOTE_SCRIPT

      - name: Verify production health
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --retry 6 \
            --retry-all-errors \
            --retry-delay 5 \
            --max-time 20 \
            "$HEALTHCHECK_URL" > /dev/null

          COURSE_SLUG="$(
            curl --fail --silent --show-error --max-time 20 "${HEALTHCHECK_URL%/home}/courses" |
            php -r '$payload = json_decode(stream_get_contents(STDIN), true); echo rawurlencode($payload["data"][0]["slug"] ?? "");'
          )"
          if [ -n "$COURSE_SLUG" ]; then
            curl --fail --silent --show-error --max-time 20 \
              "${HEALTHCHECK_URL%/home}/courses/$COURSE_SLUG" > /dev/null
          fi
